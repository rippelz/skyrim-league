[Bridge]
; Test/replay automation only. Keep 0 for normal play and use F8.
AutoStart=0
; Set 1 to skip the Survival Mode startup question.
SuppressSurvivalPrompt=1
StatePort=29741
EventPort=29742
ToggleKey=66
AnchorKey=67
ResetBallKey=68
InterpolationMs=30
TimeoutMs=3000
Scale=0.6993006993
YawDegrees=0
CarModel=Clutter\Dwemer\DwePuzzleCube.nif
BallModel=Clutter\Food\CheeseWheel01A.nif
CarScale=3.0
BallScale=5.0
FollowCamera=1
NpcBumps=1
NpcRadius=90
NpcCooldownMs=750
MaxRange=0
; Keys are DirectInput scancodes: F8=66, F9=67, F10=68.
; F8 enters/exits and anchors the current RL car position to your Skyrim position.
; F9 recalibrates while active. F10 puts the ball 300 RL units ahead of the car.
; Runtime visuals are temporary scene nodes, not saved references.

; Native loaded Skyrim collision replaces the offline RL arena.
NativeTerrain=1
; Installer fills the cross-prefix terrain export path.
TerrainMeshPath=
NpcDamageScale=0.03
; Legacy discrete surface solver; keep disabled with native terrain.
TerrainCollisions=0

; HDR reflection strength for car/ball; boost is separate.
RenderBrightness=0.2

; Append actual mesh geometry to native directional shadow maps.
CastShadows=1
