<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocket League → Skyrim</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#11161e;color:#e7edf6}header{padding:16px 24px;border-bottom:1px solid #34404e;display:flex;align-items:center;gap:18px}h1{font-size:18px;margin:0}button{background:#2b3c50;color:white;border:1px solid #526477;border-radius:6px;padding:9px 14px;cursor:pointer}button.active{background:#185d76}p{margin:10px 24px;color:#b5c3d5;font-size:14px}iframe{border:0;display:none;width:100%;height:calc(100vh - 140px)}iframe.active{display:block}.hint{font-size:12px}
</style>
<header><h1>Rocket League → Skyrim</h1><nav id="tabs"></nav><button onclick="document.documentElement.requestFullscreen()">Full screen</button></header>
<p>__INSTRUCTIONS__</p>
<p class="hint">Skyrim: F8 exit · F9 anchor · F10 reset ball. RL console: sb_start / sb_stop. This browser viewer adds display latency; controller routing still needs a live check. Terrain collision is not yet mirrored.</p>
<main id="views"></main>
<script>
const panels=__PANELS__, password="__PASSWORD__";
for(const p of panels){
 const b=document.createElement('button');b.textContent=p.name==='rl'?'Rocket League setup':'Skyrim';b.dataset.name=p.name;
 const f=document.createElement('iframe');f.dataset.name=p.name;f.allow='fullscreen';
 f.src=`http://127.0.0.1:${p.port}/vnc.html?autoconnect=true&resize=scale&reconnect=true&key_hold_ms=80&mouse_hold_ms=100#password=${password}`;
 document.querySelector('#tabs').append(b);document.querySelector('#views').append(f);
 b.onclick=()=>{for(const e of document.querySelectorAll('[data-name]'))e.classList.toggle('active',e.dataset.name===p.name)};
}
document.querySelector('nav button')?.click();
</script></html>
